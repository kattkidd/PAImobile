# Builds PAI.ipa on GitHub's free cloud Macs — no Mac needed on your side.
# Runs every time you push, or manually from the Actions tab ("Run workflow").
name: Build PAI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project PAI.xcodeproj \
            -scheme PAI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/PAI.app || (echo "Build failed — see full log below"; tail -n 200 build.log; exit 1)

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PAI.app Payload/
          # Ad-hoc sign with the App Group entitlements so sideloading tools can carry them over.
          if [ -d Payload/PAI.app/PlugIns/PAIWidget.appex ]; then
            codesign --force --sign - --entitlements Widget/PAIWidget.entitlements Payload/PAI.app/PlugIns/PAIWidget.appex || true
          fi
          codesign --force --sign - --entitlements App/PAI.entitlements Payload/PAI.app || true
          zip -qry PAI.ipa Payload
          ls -lh PAI.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PAI-ipa
          path: PAI.ipa
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
