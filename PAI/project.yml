# XcodeGen spec — turns this folder into PAI.xcodeproj (done automatically by the GitHub build).
name: PAI
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""

targets:
  PAI:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # SS14 + fork game data, kept as folders inside the app (sprites, sounds, music).
      - path: GameData/Character
        type: folder
      - path: GameData/Audio
        type: folder
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PAI
        UIAppFonts:
          - NotoSans-Regular.ttf
          - NotoSans-Bold.ttf
          - NotoSans-Italic.ttf
          - NotoSans-BoldItalic.ttf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.yourname.pai
            CFBundleURLSchemes:
              - pai
    entitlements:
      path: App/PAI.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourname.pai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.pai
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PAIWidget
    scheme: {}

  PAIWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PAI Widget
        UIAppFonts:
          - NotoSans-Regular.ttf
          - NotoSans-Bold.ttf
          - NotoSans-Italic.ttf
          - NotoSans-BoldItalic.ttf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/PAIWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.yourname.pai
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.pai.widget
        SKIP_INSTALL: YES
